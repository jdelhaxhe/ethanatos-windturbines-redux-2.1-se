[mod-setting-description]
wt-low-vram=Uses lower-resolution sprites and halves directional rotations (16 instead of 32) to reduce VRAM usage.
wt-se-balancing=When Space Exploration is active, aligns wind turbine technology prerequisites and science packs with SE progression (unlocking Mk3 with Rocket Science Pack).
wt-se-block-in-space=When Space Exploration is active, prevents placing wind turbines in orbit, asteroid zones, or spaceships, and forces 0 W output on non-solid surfaces.
wt-spacing-mk1=Minimum center-to-center distance in tiles between two Wind Turbine Mk1 towers. Mixed-tier spacing uses the sum of radii: ceil((D1 + D2) / 2).
wt-spacing-mk2=Minimum center-to-center distance in tiles between two Wind Turbine Mk2 towers. Mixed-tier spacing uses the sum of radii: ceil((D1 + D2) / 2).
wt-spacing-mk3=Minimum center-to-center distance in tiles between two Wind Turbine Mk3 towers. Mixed-tier spacing uses the sum of radii: ceil((D1 + D2) / 2).
wt-power-mk1=Nominal electrical output of Wind Turbine Mk1 in kW at 100% reference wind speed.
wt-power-mk2=Nominal electrical output of Wind Turbine Mk2 in kW at 100% reference wind speed.
wt-power-mk3=Nominal electrical output of Wind Turbine Mk3 in kW at 100% reference wind speed.
wt-locked-power=If enabled, turbines always output their constant nominal power regardless of wind speed (still 0 W on airless Space Exploration zones).
wt-vary-windspeed=Gently varies wind speed on solid surfaces every 5 seconds. Automatically paused when WindSpeedChanging is active.
wt-reference-wind-speed=Surface wind speed corresponding to 100% nominal output (vanilla default is 0.02). Overridden when auto-calibration is active with WindSpeedChanging.
wt-auto-calibrate-wsc=Automatically calibrates reference wind speed to the midpoint of WindSpeedChanging's min/max wind speed settings so both power and rotor speed stay well-proportioned.
wt-max-wind-multiplier=Upper cap on wind-scaled electrical output relative to nominal power during peak gusts (e.g., 2.0 allows up to 200% output).
wt-update-interval=Tick interval between runtime surface wind checks (30 ticks = 0.5 seconds). Higher values reduce UPS cost on large multi-surface saves.
wt-show-spacing-overlay=Displays ground exclusion zones around existing wind turbines while holding a wind turbine item or ghost in your cursor. Zero UPS cost when not placing turbines.
